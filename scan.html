<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    * {
        box-sizing: border-box; /* 🔑 MOST IMPORTANT */
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #1f3c45, #020617);
    }

    .card {
        width: 100%;
        max-width: 380px;
        background: linear-gradient(180deg, #020617, #020617cc);
        padding: 32px 26px;
        border-radius: 18px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    p {
        margin: 0 0 22px;
        font-size: 14px;
        color: #9ca3af;
    }

    form {
        width: 100%;
    }

    input {
        width: 100%;
        height: 46px; /* 🔑 equal height */
        padding: 0 14px;
        margin-bottom: 14px;
        border-radius: 10px;
        border: 1px solid #1f2933;
        background: #020617;
        color: #e5e7eb;
        font-size: 14px;
        outline: none;
        display: block;
    }

    input::placeholder {
        color: #6b7280;
    }

    input:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56,189,248,0.3);
    }

    button {
        width: 100%;
        height: 48px;
        margin-top: 6px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: #020617;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .note {
        margin-top: 16px;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.4;
    }
</style>


</head>

<body>

    <div class="card">
        <h1>Scan Complete ✅</h1>
        <p>Please confirm your details</p>

        <form action="/submit" method="post">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <button type="submit">Continue</button>
        </form>

        <div class="note">
            By continuing, you agree to share your information.
        </div>
    </div>

</body>
</html>
